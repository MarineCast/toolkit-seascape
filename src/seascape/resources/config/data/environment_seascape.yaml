        type_name: pub:WHSE_ENVIRONMENTAL_MONITORING.SHZN_SHORE_UNIT_CLASS_LINES_SV
        bbox_axis_order: lon_lat
        raw_filename: BC_SHOREZONE_SHORE_UNIT_CLASS_LINES.geojson
        normalizer: bc_shorezone
        evidence_class: systematic_shoreline_mapping
        license: Open Government Licence - British Columbia
        attribution: Province of British Columbia ShoreZone
      noaa_coastal_maintained_channels:
        kind: arcgis
        layer_url: https://encdirect.noaa.gov/arcgis/rest/services/NavigationChartData/MarineTransportation/FeatureServer/1
        fields: '*'
        raw_filename: NOAA_COASTAL_MAINTAINED_CHANNELS.geojson
        normalizer: dredged_channel
        evidence_class: authoritative_navigation_mapping
        license: United States Government public domain
        attribution: NOAA Office of Coast Survey and US Army Corps of Engineers
      wa_ecology_disposal_sites:
        kind: arcgis
        layer_url: https://gis.ecology.wa.gov/serverext/rest/services/GIS/CoastalAtlas/MapServer/1116
        fields: '*'
        raw_filename: WA_ECOLOGY_OCEAN_DISPOSAL_SITES.geojson
        normalizer: disposal_site
        evidence_class: authoritative_inventory
        license: Washington State agency open data terms
        attribution: Washington State Department of Ecology Coastal Atlas
      ca_active_disposal_sites:
