# SEASCAPE - BIOGENIC HABITAT: SATELLITE-DERIVED SEAGRASS
seagrass_habitat:
  area: model_area
  download:
    raw_dir: data/raw/environment/seascape/biogenic_habitat/seagrass
    request_timeout_seconds: 300
    page_size: 2000
    overwrite: false
    sources:
      global_sentinel2_seagrass_2023_2024:
        kind: http_archive
        url: https://zenodo.org/api/records/18612240/files/GlobalSeagrass2023_2024.zip/content
        raw_filename: GlobalSeagrass2023_2024.zip
        # Keep the highly compressed tiled archive intact (about 449 MB versus
        # 11.9 GB extracted); rasterio reads only intersecting tiles via VSI ZIP.
        extract: false
        expected_bytes: 448760997
        md5: d371628f0e343244eb47f188f0a89726
        evidence_class: satellite_model
        license: CC BY 4.0
        attribution: Peng et al. (2026), Global 10-meter seagrass maps, Zenodo 10.5281/zenodo.18612240
  processing:
    native_h3_resolution: 8
    model_h3_resolution: 6
    equal_area_crs: EPSG:6933
    reference_year: 2026
    marine_buffer_m: 5000
    observation_period: 2023-2024
    # The distributed extent tiles are binary: 1 = mapped seagrass and
    # 0 = background/nodata. Dense/sparse model classes are not retained.
    positive_values: [1]
    processed_directory: data/processed/domain/environmental_layer/seascape/biogenic_habitat/seagrass
    inventory_filename: SEAGRASS_SOURCE_INVENTORY.parquet
    feature_filename_template: SEAGRASS_RES_{res}.parquet
    confidence_filename_template: SEAGRASS_CONFIDENCE_RES_{res}.parquet
    manifest_filename: seagrass_habitat_manifest.json

