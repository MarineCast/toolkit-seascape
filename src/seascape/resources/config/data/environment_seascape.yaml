# SEASCAPE - CROSS-BORDER ANTHROPOGENIC STRUCTURES
anthropogenic_seascape:
  area: model_area
  download:
    raw_dir: data/raw/environment/seascape/anthropogenic
    request_timeout_seconds: 300
    page_size: 2000
    overwrite: false
    sources:
      osm_cross_border_anthropogenic:
        kind: overpass
        endpoints:
          - https://overpass-api.de/api/interpreter
          - https://overpass.kumi.systems/api/interpreter
          - https://overpass.private.coffee/api/interpreter
        attempts_per_endpoint: 2
        retry_backoff_seconds: 2
        request_delay_seconds: 1
        query_timeout_seconds: 120
        tile_degrees: 1.5
        # OSM is the common coverage backbone, not the exact-area authority.
        # Centers retain every tagged feature with far lower public-server load;
        # government polygons/lines provide defensible fractions where available.
        geometry_mode: center
        query_filters:
          - '["man_made"~"^(seawall|breakwater|groyne|jetty|pier|causeway|quay)$"]'
          - '["amenity"="ferry_terminal"]'
          - '["leisure"="marina"]'
          - '["industrial"="port"]'
          - '["harbour"="yes"]'
          - '["seamark:type"~"^(causeway|dredged_area|dumping_ground|artificial_reef|shoreline_construction|marine_farm|harbour)$"]'
          - '["landuse"="aquaculture"]'
          - '["aquaculture"]'
        raw_filename: OSM_ANTHROPOGENIC_FEATURES.json
        normalizer: osm
        evidence_class: volunteered_mapping
        license: Open Database License 1.0
        attribution: OpenStreetMap contributors and OpenSeaMap
        dataset_url: https://www.openstreetmap.org/copyright
      wa_dnr_shoreline_modification:
        kind: arcgis
        layer_url: https://gis.dnr.wa.gov/site3/rest/services/Aquatics/AQ_Environment/MapServer/51
        fields: [OBJECTID, UNIT_ID, SM_TOT_PCT, SM1_TYPE, SM1_PCT, SM1_FT, SM2_TYPE, SM2_PCT, SM2_FT, SM3_TYPE, SM3_PCT, SM3_FT, PIERDOCK, SLIP_SMALL, SLIP_LARGE]
        raw_filename: WA_DNR_SHORELINE_MODIFICATION.geojson
        normalizer: wa_shorezone
        evidence_class: systematic_shoreline_mapping
        license: Washington State agency open data terms
