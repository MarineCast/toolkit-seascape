name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable vX.Y.Z tag to backfill to PyPI'
        required: true
        type: string

jobs:
  github-release:
    if: github.event_name == 'push' && github.repository == 'MarineCast/toolkit-seascape'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the immutable tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set up release Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify clean checkout and tag/version identity
        run: |
          test -z "$(git status --porcelain)"
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Install build validation tools
        run: python -m pip install '.[build]'
      - name: Build wheel and source distribution once
        run: python -m build --outdir "$RUNNER_TEMP/seascape-distributions"
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check "$RUNNER_TEMP/seascape-distributions"/*
          python scripts/check_distribution.py \
            --sdist "$RUNNER_TEMP/seascape-distributions"/*.tar.gz \
            --wheel "$RUNNER_TEMP/seascape-distributions"/*.whl \
            --output "$RUNNER_TEMP/distribution-report.json"
      - name: Install as a clean consumer and run the offline demo
        run: |
          python scripts/check_consumer_install.py \
            --wheel "$RUNNER_TEMP/seascape-distributions"/*.whl \
            --source "$GITHUB_WORKSPACE" \
            --forbid-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/seascape-release-consumer"
      - name: Upload the validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/seascape-distributions/*.whl
            ${{ runner.temp }}/seascape-distributions/*.tar.gz
      - name: Create immutable GitHub Release with software artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          # toolkit-seascape $GITHUB_REF_NAME

          ## Status

          Public preview. The 0.x API and schemas may change in documented minor releases.

          ## Installation

          \`pip install toolkit-seascape==$version\`

          ## Scientific changes and limitations

          Review the versioned [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)
          for method identities, scientific changes, compatibility, and limitations. These assets
          contain software only; they are not a regional scientific data release.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/seascape-distributions"/*.whl \
            "$RUNNER_TEMP/seascape-distributions"/*.tar.gz \
            --verify-tag \
            --title "toolkit-seascape $GITHUB_REF_NAME" \
            --notes-file "$notes"

  backfill-existing-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'MarineCast/toolkit-seascape'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require an existing version tag absent from PyPI
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git ls-remote --exit-code --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" >/dev/null
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/toolkit-seascape/${RELEASE_TAG#v}/json")"
          test "$status" = 404
      - name: Check out the immutable existing tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify clean checkout and tag/version identity
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          test "$remote_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python scripts/check_release_version.py "$RELEASE_TAG"
      - name: Verify the existing GitHub Release and download its distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-release.json"
          mkdir -p "$RUNNER_TEMP/seascape-distributions"
          gh release download "$RELEASE_TAG" \
            --dir "$RUNNER_TEMP/seascape-distributions" \
            --pattern "toolkit_seascape-${RELEASE_TAG#v}*"
          python - "$RUNNER_TEMP/existing-release.json" "$RUNNER_TEMP/seascape-distributions" "$RELEASE_TAG" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text())
          directory = Path(sys.argv[2])
          tag = sys.argv[3]
          version = tag[1:]
          expected = {
              f"toolkit_seascape-{version}-py3-none-any.whl",
              f"toolkit_seascape-{version}.tar.gz",
          }
          assert release["tag_name"] == tag
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert len(assets) == len(release["assets"])
          assert set(assets) == expected, set(assets)
          assert {path.name for path in directory.iterdir()} == expected
          for name in expected:
              digest = assets[name]["digest"]
              assert digest and digest.startswith("sha256:"), name
              assert hashlib.sha256((directory / name).read_bytes()).hexdigest() == digest[7:], name
          PY
      - name: Set up release Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build validation tools
        run: python -m pip install '.[build]'
      - name: Build once from the exact existing tag
        run: python -m build --outdir "$RUNNER_TEMP/rebuilt-distributions"
      - name: Confirm the existing assets match the tagged build and are valid
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/rebuilt-distributions" "$RUNNER_TEMP/seascape-distributions" "$RELEASE_TAG" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          rebuilt, published = map(Path, sys.argv[1:3])
          version = sys.argv[3][1:]
          wheel = f"toolkit_seascape-{version}-py3-none-any.whl"
          sdist = f"toolkit_seascape-{version}.tar.gz"

          with zipfile.ZipFile(rebuilt / wheel) as a, zipfile.ZipFile(published / wheel) as b:
              left = {item.filename: item for item in a.infolist()}
              right = {item.filename: item for item in b.infolist()}
              assert len(left) == len(a.infolist())
              assert len(right) == len(b.infolist())
              assert left.keys() == right.keys()
              for name in left:
                  assert (left[name].compress_type, left[name].external_attr) == (
                      right[name].compress_type, right[name].external_attr
                  ), name
                  assert a.read(name) == b.read(name), name

          with tarfile.open(rebuilt / sdist) as a, tarfile.open(published / sdist) as b:
              left = {item.name: item for item in a.getmembers()}
              right = {item.name: item for item in b.getmembers()}
              assert len(left) == len(a.getmembers())
              assert len(right) == len(b.getmembers())
              assert left.keys() == right.keys()
              for name in left:
                  assert (left[name].type, left[name].mode, left[name].linkname) == (
                      right[name].type, right[name].mode, right[name].linkname
                  ), name
                  if left[name].isfile():
                      assert a.extractfile(left[name]).read() == b.extractfile(right[name]).read(), name
          PY
          python -m twine check "$RUNNER_TEMP/seascape-distributions"/*
          python scripts/check_distribution.py \
            --sdist "$RUNNER_TEMP/seascape-distributions"/*.tar.gz \
            --wheel "$RUNNER_TEMP/seascape-distributions"/*.whl \
            --output "$RUNNER_TEMP/distribution-report.json"
      - name: Install as a clean consumer and run the offline demo
        run: |
          python scripts/check_consumer_install.py \
            --wheel "$RUNNER_TEMP/seascape-distributions"/*.whl \
            --source "$GITHUB_WORKSPACE" \
            --forbid-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/seascape-release-consumer"
      - name: Upload the existing validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/seascape-distributions/*.whl
            ${{ runner.temp }}/seascape-distributions/*.tar.gz

  publish-pypi:
    needs: [github-release, backfill-existing-release]
    if: >-
      ${{ always() && github.repository == 'MarineCast/toolkit-seascape' &&
          ((github.event_name == 'push' && needs.github-release.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.backfill-existing-release.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/toolkit-seascape
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Confirm PyPI has not published this version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -f "dist/toolkit_seascape-${RELEASE_TAG#v}-py3-none-any.whl"
          test -f "dist/toolkit_seascape-${RELEASE_TAG#v}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/toolkit-seascape/${RELEASE_TAG#v}/json")"
          test "$status" = 404
      # PyPI authorizes this environment through GitHub OIDC Trusted Publishing.
      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
