name: package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q
      - run: seascape --help
      - run: |
          workspace="$(mktemp -d)/seascape-workspace"
          seascape --workspace "$workspace" init
          test -f "$workspace/config/data/project.yaml"
          test -f "$workspace/config/data/environment_seascape.yaml"
          test -f "$workspace/config/data/presentation_settings.yaml"
          seascape --workspace "$workspace" build --dry-run
      - run: seascape build --dry-run
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: |
          repo="$PWD"
          wheel_env="$(mktemp -d)/wheel-env"
          python -m venv --system-site-packages "$wheel_env"
          "$wheel_env/bin/python" -m pip install --force-reinstall --no-deps dist/*.whl
          outside="$(mktemp -d)"
          workspace="$(mktemp -d)/seascape-workspace"
          cp tests/test_products.py tests/test_review_regressions.py "$outside/"
          cd "$outside"
          "$wheel_env/bin/python" "$repo/scripts/check_installed_package.py"
          "$wheel_env/bin/python" -m pytest -q --noconftest test_products.py test_review_regressions.py
          "$wheel_env/bin/seascape" --help
          "$wheel_env/bin/seascape" --workspace "$workspace" init
          test -f "$workspace/config/data/project.yaml"
          test -f "$workspace/config/data/environment_seascape.yaml"
          test -f "$workspace/config/data/presentation_settings.yaml"
          "$wheel_env/bin/seascape" --workspace "$workspace" build --dry-run
          "$wheel_env/bin/python" - <<'PY'
          from importlib.resources import files

          from seascape.core.data import catalog  # noqa: F401
          from seascape.core.data.registry import DATASETS

          root = files("seascape")
          required = (
              "products.py",
              "core/data/catalog.py",
              "core/data/contracts.py",
              "core/data/registry.py",
              "core/data/validation.py",
              "resources/config/common.yaml",
              "resources/config/data/project.yaml",
              "resources/config/data/environment_seascape.yaml",
              "resources/config/data/presentation_settings.yaml",
          )
          assert len(tuple(DATASETS)) == 75
          assert all(root.joinpath(*path.split("/")).is_file() for path in required)
          assert not root.joinpath("resources/config/feature_catalog.yaml").is_file()
          assert not root.joinpath("resources/config/model_feature_policy.yaml").is_file()
          PY
      - run: git diff --check
  notebook-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[notebook]'
      - run: python -m pip check
      - run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/validation/01_TOOLKIT_VALIDATION.ipynb \
            --ExecutePreprocessor.timeout=120 \
            --output seascape-toolkit-validation.ipynb \
            --output-dir /tmp
      - run: git diff --exit-code

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test,quality]'
      - run: python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src/seascape/products.py src/seascape/core/geo/crs.py src/seascape/core/artifacts/confinement.py src/seascape/seafloor_physiography/depth.py
      - run: python -m mypy
      - run: python scripts/environment_snapshot.py --output /tmp/seascape-environment
      - run: pip-audit --disable-pip --no-deps --strict -r /tmp/seascape-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-environment
          path: /tmp/seascape-environment.*

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      # Standalone CLI avoids an organization-specific action license requirement.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git . --redact --no-banner --log-opts="--all"
      - run: gitleaks dir . --redact --no-banner
