[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-seascape"
version = "0.1.1"
description = "Source-backed marine geometry, bathymetry, and seascape products"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "branca>=0.7", "folium>=0.20", "geopandas>=1.0", "h3>=4.0",
  "matplotlib>=3.8", "networkx>=3.2", "numpy>=1.26", "pandas>=2.1",
  "polars>=1.0", "pyarrow>=14", "pydantic>=2.0", "pyproj>=3.6",
  "PyYAML>=6.0", "rasterio>=1.4,<1.5.2", "requests>=2.31", "scipy>=1.11",
  "shapely>=2.0", "urllib3>=2.0",
]

[project.optional-dependencies]
build = ["build>=1.2", "setuptools>=80", "twine>=6", "wheel"]
test = ["pytest>=8"]
quality = ["ruff>=0.9", "mypy>=1.15", "pip-audit>=2.9", "pip>=26.2"]
notebook = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "nbconvert>=7",
]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
seascape = "seascape.cli:main"

[project.urls]
Homepage = "https://marinecast.github.io/toolkit-seascape/"
Documentation = "https://marinecast.github.io/toolkit-seascape/"
Repository = "https://github.com/MarineCast/toolkit-seascape"
Issues = "https://github.com/MarineCast/toolkit-seascape/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seascape = ["resources/**/*", "**/*.md", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Selected correctness, unused-name and import rules across source/tests/scripts.
select = ["E9", "F63", "F7", "F82", "F401", "F841", "F811", "F601", "F602", "B006", "I001"]

[tool.mypy]
python_version = "3.14"
files = [
  "src/seascape/products.py",
  "src/seascape/core/geo/crs.py",
  "src/seascape/core/artifacts/confinement.py",
  "src/seascape/seafloor_physiography/depth.py",
  "src/seascape/demo.py",
  "src/seascape/cli.py",
  "src/seascape/_cli_diagnostics.py",
  "src/seascape/preflight.py",
  "src/seascape/core/config/document.py",
  "src/seascape/core/config/data.py",
  "src/seascape/core/config/paths.py",
  "src/seascape/metric_matrix.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
