[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-seascape"
version = "0.1.0"
description = "Source-backed marine geometry, bathymetry, and seascape products"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "branca>=0.7", "folium>=0.20", "geopandas>=1.0", "h3>=4.0",
  "matplotlib>=3.8", "networkx>=3.2", "numpy>=1.26", "pandas>=2.1",
  "polars>=1.0", "pyarrow>=14", "pydantic>=2.0", "pyproj>=3.6",
  "PyYAML>=6.0", "rasterio>=1.4", "requests>=2.31", "scipy>=1.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seascape = "seascape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seascape = ["resources/**/*", "**/*.md", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
