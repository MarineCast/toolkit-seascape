schema_version: 4
catalog_id: environment.seascape
generated_from_materialized_schemas: true
catalog_contract:
  scope: Every non-key column in the canonical materialized seascape products listed below.
  collection_lookup: Each feature records collection_paths.<resolution> as the Parquet path and column
    as the exact collection column; product-level paths are the same contract.
  common_name_lookup: Use products.<product>.features.<column>.common_name for a human-readable name.
  metric_taxonomy: metric_family identifies seascape; metric_subfamily identifies its physical mechanisms.
  metric_family_vocabulary:
  - seascape
  metric_subfamily_vocabulary:
  - anthropogenic
  - benthic
  - coastal_configuration
  - hydrologic_connectivity
  - seafloor_physiography
  - spatial_support
  excluded_key_columns:
  - DATE
  - H3_INDEX
  - H3_RESOLUTION
  roles:
    predictor: Model-facing numeric covariate.
    categorical: Model-facing categorical value.
    state: Presence, absence, reachability, or another explicit state.
    coverage: Sampling or aggregation coverage field.
    evidence: Confidence, provenance, or survey evidence.
    support_or_qc: Spatial-support, connector, lineage, or QC field.
    identifier: Foreign key or source identity; not a numeric predictor.
    physical_metric: Measured or physically derived atmospheric metric.
    astronomical_metric: Deterministic solar or lunar metric.
    storm_metric: Operational storm metric, not an authoritative classification.
    categorical_metric: Substantive categorical environmental value.
    provenance_or_qc: Source lineage, availability, support, or QC metadata.
    bookkeeping: Calendar, coordinate, distance, or deterministic bookkeeping metadata.
  variable_kinds:
    feature_variable: A substantive metric, category, or state that may be considered for a model after
      policy and leakage review.
    metadata: Coverage, survey or evidence quality, provenance, identifiers, support, bookkeeping, and
      QC; never a default model feature.
  materialization_policy: Generate and verify this catalog from materialized seascape candidate products
    before release.
product_count: 27
